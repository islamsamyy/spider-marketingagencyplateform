<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="50%" stop-color="#ff003c" />
      <stop offset="100%" stop-color="#92001e" />
    </linearGradient>
  </defs>
  
  <!-- Outer Cyber Hex Shield -->
  <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" stroke="#ff003c" stroke-width="2.5" stroke-opacity="0.4" fill="#0e0e12" />
  
  <!-- Spider Abdomen / Core -->
  <path d="M50 34 L60 48 L56 68 L50 74 L44 68 L40 48 Z" fill="url(#spiderGlow)" filter="url(#glow)" />
  <circle cx="50" cy="30" r="5" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Spider Legs (Geometric / Cybernetic) -->
  <!-- Upper Left -->
  <path d="M42 42 L24 30 L16 38" stroke="#ff003c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Mid Left -->
  <path d="M40 50 L18 48 L14 58" stroke="#ff003c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Lower Left 1 -->
  <path d="M42 58 L20 64 L18 76" stroke="#ff2a55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Lower Left 2 -->
  <path d="M45 66 L28 78 L26 88" stroke="#ff2a55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Upper Right -->
  <path d="M58 42 L76 30 L84 38" stroke="#ff003c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Mid Right -->
  <path d="M60 50 L82 48 L86 58" stroke="#ff003c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Lower Right 1 -->
  <path d="M58 58 L80 64 L82 76" stroke="#ff2a55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Lower Right 2 -->
  <path d="M55 66 L72 78 L74 88" stroke="#ff2a55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Core Accent -->
  <circle cx="50" cy="52" r="3" fill="#ffffff" />
</svg>

